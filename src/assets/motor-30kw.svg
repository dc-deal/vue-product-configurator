<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Motor 30 kW">
  <title>Motor 30 kW</title>
  <!-- Outermost housing flange -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Outer housing ring -->
  <circle cx="100" cy="100" r="68" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <!-- Inner motor housing -->
  <circle cx="100" cy="100" r="55" fill="none" stroke="currentColor" stroke-width="3"/>
  <circle cx="100" cy="100" r="42" fill="currentColor" opacity="0.16"/>
  <!-- 16 cooling fins -->
  <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <line x1="100" y1="14" x2="100" y2="27"/>
    <line x1="131" y1="18" x2="127" y2="30"/>
    <line x1="159" y1="34" x2="151" y2="44"/>
    <line x1="180" y1="59" x2="169" y2="65"/>
    <line x1="186" y1="100" x2="173" y2="100"/>
    <line x1="180" y1="141" x2="169" y2="135"/>
    <line x1="159" y1="166" x2="151" y2="156"/>
    <line x1="131" y1="182" x2="127" y2="170"/>
    <line x1="100" y1="186" x2="100" y2="173"/>
    <line x1="69" y1="182" x2="73" y2="170"/>
    <line x1="41" y1="166" x2="49" y2="156"/>
    <line x1="20" y1="141" x2="31" y2="135"/>
    <line x1="14" y1="100" x2="27" y2="100"/>
    <line x1="20" y1="59" x2="31" y2="65"/>
    <line x1="41" y1="34" x2="49" y2="44"/>
    <line x1="69" y1="18" x2="73" y2="30"/>
  </g>
  <!-- Shaft with key -->
  <circle cx="100" cy="100" r="9" fill="currentColor"/>
  <rect x="97" y="92" width="6" height="3" fill="white"/>
  <!-- Label -->
  <text x="100" y="195" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="currentColor">30 kW</text>
</svg>
